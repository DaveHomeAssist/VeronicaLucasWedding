name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Site checks + Worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Site behavior checks
        run: node tests/site-check.mjs

      - name: Worker unit tests
        run: node --test worker/test/index.test.js
